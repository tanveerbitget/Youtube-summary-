name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q SummaryYou-lite.zip
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Build debug APK
        working-directory: SummaryYou-customized
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFossDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SummaryYou-debug-apk
          path: SummaryYou-customized/app/build/outputs/apk/foss/debug/*.apk
